<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saída | Estacionamento Escolar</title>
    <link rel="stylesheet" href="/estacionamento.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">↓</span>
            <span class="brand-copy"><strong>Estacionamento</strong><span>Gestão escolar</span></span>
        </div>
        <div class="nav-label">Operações</div>
        <nav class="nav">
            <a href="/veiculo/registrar_entrada"><span class="nav-icon">↑</span><span>Entrada</span></a>
            <a href="/veiculo/registrar_saida" class="active"><span class="nav-icon">↓</span><span>Saída</span></a>
            <a href="/"><span class="nav-icon">⌂</span><span>Início</span></a>
        </nav>
        <div class="sidebar-footer">Selecione a placa correspondente ao veículo que está deixando a escola.</div>
    </aside>

    <main class="main">
        <div class="operation-wrap">
            <a class="back-link" href="/">← Voltar ao painel</a>
            <section class="operation-card">
                <div class="operation-head">
                    <div class="operation-icon exit" aria-hidden="true">↓</div>
                    <div>
                        <h1>Registrar saída</h1>
                        <p>Escolha o veículo que está deixando o estacionamento.</p>
                    </div>
                </div>
                    <div class="table-scroll">
                        <table class="parking-table">
                            <thead>
                            <tr>
                                <th scope="col">Placa</th>
                                <th scope="col">Modelo</th>
                                <th scope="col">Entrada</th>
                                <th scope="col">Status</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="veiculo : ${veiculos}">
                                <td class="plate-cell" th:text="${veiculo.placa}"></td>
                                <td class="model-cell" th:text="${veiculo.modelo}"></td>
                                <td class="time-cell" th:text="${#temporals.format(veiculo.horaEntrada, 'HH:mm')}"></td>
                                <form th:action="'saida/'+${veiculo.id}">
                                    <td>
                                        <button class="btn btn-primary" type="submit">Salvar saída</button>
                                    </td>
                                </form>
                            </tr>

                            <tr th:if="${#lists.isEmpty(veiculos)}">
                                <td colspan="4">Nenhum veículo estacionado</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
            </section>
        </div>
    </main>
</div>

<script>
    function selecionarVeiculo(id) {
        if (id) {
            window.location.href = "/veiculo/saida/" + id;
        } else {
            window.location.href = "/veiculo/registrar_saida";
        }
    }
</script>
</body>
</html>
